spring:
  application:
    name: ordered-config-server
  profiles:
    active: native
  cloud:
    config:
      server:
        overrides:
          app.jwt.secret: ${JWT_SECRET}
          ordered.gateway.security.jwt-secret: ${JWT_SECRET}
        native:
          search-locations: classpath:/config-repo/

server:
  port: ${PORT:8888}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always

logging:
  level:
    org.springframework.cloud.config: INFO
